<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <title>Pilot Sequence</title>
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b1f36;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      /* later scene sits above the earlier one during each 0.3 s crossfade */
      #el-hook { z-index: 1; }
      #el-compare { z-index: 2; }
      #el-cta { z-index: 3; }
    </style>
  </head>
  <body>
    <!--
      Pilot sequence: hook-t03 (T03) -> compare-t09 (T09 + B15) -> cta (cb46c00 port).
      Two transitions, each a 0.3 s crossfade done by fading the incoming slot in (index.html = project entry; render: npm run render).
    -->
    <div
      id="root"
      data-composition-id="sequence"
      data-start="0"
      data-duration="16.4"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-hook"
        data-composition-id="hook-t03"
        data-composition-src="compositions/hook-t03.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-compare"
        data-composition-id="compare-t09"
        data-composition-src="compositions/compare-t09.html"
        data-start="4.2"
        data-duration="8"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-cta"
        data-composition-id="cta"
        data-composition-src="compositions/cta.html"
        data-start="11.9"
        data-duration="4.5"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- narration -->
      <audio id="seq-voice-hook" src="assets/voice/hook.mp3" data-start="0" data-duration="4.41" data-track-index="10" data-volume="1"></audio>
      <audio id="seq-voice-repeat" src="assets/voice/repeat.mp3" data-start="4.7" data-duration="6.416" data-track-index="10" data-volume="1"></audio>
      <audio id="seq-voice-cta" src="assets/voice/cta.mp3" data-start="11.9" data-duration="3.597" data-track-index="10" data-volume="1"></audio>
      <audio id="seq-sfx-reveal" src="assets/sfx/cta-reveal.wav" data-start="12.06667" data-duration="1.6" data-track-index="11" data-volume="1"></audio>
      <!-- BGM A: Main60 track from 0 s under hook + compare (-12 dB), out over the second crossfade -->
      <audio
        id="seq-bgm-a"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="12.2"
        data-media-start="0"
        data-track-index="12"
        data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.251189},{"t":11.9,"v":0.251189},{"t":12.2,"v":0}]}]}'
      ></audio>
      <!-- BGM B: the CTA ending (Main60 offset 55.5 s), same ducking as index.html, faded in over the crossfade -->
      <audio
        id="seq-bgm-b"
        src="assets/bgm/track.mp3"
        data-start="11.9"
        data-duration="4.5"
        data-media-start="55.5"
        data-track-index="13"
        data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.3,"v":0.251189},{"t":3.59775,"v":0.251189},{"t":4.19775,"v":0.501187},{"t":4.5,"v":0.501187}]}]}'
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#el-compare", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 4.2);
      tl.fromTo("#el-cta", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 11.9);
      window.__timelines["sequence"] = tl;
    </script>
  </body>
</html>
