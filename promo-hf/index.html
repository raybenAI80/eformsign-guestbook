<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Brand fonts — same files as promo/src/theme.ts */
      @font-face {
        font-family: "Paperlogy";
        src: url("assets/fonts/Paperlogy-8ExtraBold.ttf") format("truetype");
        font-weight: 800;
        font-display: block;
      }
      @font-face {
        font-family: "Pretendard";
        src: url("assets/fonts/Pretendard-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        /* Korean line breaking (W3C klreq 7.1) — never overflow-wrap:anywhere */
        word-break: keep-all;
        overflow-wrap: break-word;
        line-break: strict;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a5a99;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Pretendard", sans-serif;
        color: #ffffff;
      }
      /* Stage variant="blue" */
      #cta-bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(160deg, #0e73c3 0%, #0a5a99 100%);
      }
      #cta-three {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }
      /* ctaFaceStyle(): same perspective as the three camera; transform set per frame by renderAt() */
      #cta-face {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      #cta-stack {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
      }
      #cta-logo {
        display: block;
        width: 620px;
      }
      #cta-slogan {
        display: block;
        width: 430px;
      }
      #cta-lead {
        font-family: "Paperlogy", sans-serif;
        font-weight: 800;
        font-size: 72px;
        color: #ffffff;
        text-align: center;
        margin-top: 18px;
        text-shadow: 0 4px 28px rgba(0, 0, 0, 0.35);
        text-wrap: balance;
      }
      /* landing address = one unbreakable unit */
      #cta-address {
        white-space: nowrap;
        font-family: "Paperlogy", sans-serif;
        font-weight: 800;
        font-size: 62px;
        letter-spacing: 1px;
        color: #0e73c3;
        background: #ffffff;
        border-radius: 999px;
        padding: 18px 56px;
        box-shadow: 0 18px 46px rgba(0, 0, 0, 0.22);
      }
      #cta-footnote {
        font-family: "Pretendard", sans-serif;
        font-weight: 400;
        font-size: 28px;
        color: rgba(255, 255, 255, 0.8);
        margin-top: 10px;
        text-wrap: balance;
      }
      .nb {
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="cta"
      data-start="0"
      data-duration="4.5"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="cta-bg"></div>
      <canvas id="cta-three" width="1920" height="1080"></canvas>
      <div id="cta-face">
        <div id="cta-stack">
          <!-- logo + slogan = provided PNGs, never re-typeset -->
          <img id="cta-logo" src="assets/brand/eformsign-logo-white.png" alt="eformsign" />
          <img id="cta-slogan" src="assets/brand/slogan-h-white.png" alt="" />
          <div id="cta-lead">지금 시작해 보세요</div>
          <div id="cta-address">eformsign.com</div>
          <div id="cta-footnote">활용 사례: <span class="nb">이폼사인 방명록</span></div>
        </div>
      </div>

      <!-- narration (promo Narration id="cta") -->
      <audio
        id="cta-voice"
        src="assets/voice/cta.mp3"
        data-start="0"
        data-duration="3.597"
        data-track-index="10"
        data-volume="1"
      ></audio>
      <!-- cta-reveal peak (18f) lands on the frame the tilt stops (23f) -> starts at 5f -->
      <audio
        id="cta-sfx-reveal"
        src="assets/sfx/cta-reveal.wav"
        data-start="0.16667"
        data-duration="1.6"
        data-track-index="11"
        data-volume="1"
      ></audio>
      <!-- BGM: Main60 track at offset 55.5s; ducked -12 dB while narrating, 0.6 s release to -6 dB -->
      <audio
        id="cta-bgm"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="4.5"
        data-media-start="55.5"
        data-track-index="12"
        data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.251189},{"t":3.59775,"v":0.251189},{"t":4.19775,"v":0.501187},{"t":4.5,"v":0.501187}]}]}'
      ></audio>
    </div>

    <script>
      // ---- timing contract copied from promo/src/scenes/CTA.tsx (30 fps) ----
      const FPS = 30;
      // Remotion Easing.bezier(0.16, 1, 0.3, 1) — same Newton/bisection solver (bezier-easing)
      function bezier(x1, y1, x2, y2) {
        const A = (a, b) => 1 - 3 * b + 3 * a;
        const B = (a, b) => 3 * b - 6 * a;
        const Cc = (a) => 3 * a;
        const calc = (t, a, b) => ((A(a, b) * t + B(a, b)) * t + Cc(a)) * t;
        const slope = (t, a, b) => 3 * A(a, b) * t * t + 2 * B(a, b) * t + Cc(a);
        const N = 11;
        const STEP = 1 / (N - 1);
        const samples = new Float32Array(N);
        for (let i = 0; i < N; i++) samples[i] = calc(i * STEP, x1, x2);
        function tForX(x) {
          let start = 0;
          let i = 1;
          for (; i !== N - 1 && samples[i] <= x; i++) start += STEP;
          i--;
          const dist = (x - samples[i]) / (samples[i + 1] - samples[i]);
          let g = start + dist * STEP;
          const s0 = slope(g, x1, x2);
          if (s0 >= 0.001) {
            for (let k = 0; k < 4; k++) {
              const s = slope(g, x1, x2);
              if (s === 0) break;
              g -= (calc(g, x1, x2) - x) / s;
            }
            return g;
          }
          if (s0 === 0) return g;
          let a = start;
          let b = start + STEP;
          let cur = 0;
          let cx = 0;
          let it = 0;
          do {
            cur = a + (b - a) / 2;
            cx = calc(cur, x1, x2) - x;
            if (cx > 0) b = cur;
            else a = cur;
          } while (Math.abs(cx) > 1e-7 && ++it < 10);
          return cur;
        }
        return (x) => (x <= 0 ? 0 : x >= 1 ? 1 : calc(tForX(x), y1, y2));
      }
      window.CTA_EASE = bezier(0.16, 1, 0.3, 1);
      const EASE = window.CTA_EASE;
      const f = (n) => n / FPS;

      const tl = gsap.timeline({ paused: true });
      // p = [0,22] logo/slogan, q = [18,40] lead, r = [34,58] address/footnote (all EASE)
      tl.fromTo("#cta-logo", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: f(22), ease: EASE }, 0);
      tl.fromTo("#cta-slogan", { opacity: 0 }, { opacity: 0.9, duration: f(22), ease: EASE }, 0);
      tl.fromTo("#cta-lead", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: f(22), ease: EASE }, f(18));
      tl.fromTo("#cta-address", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: f(24), ease: EASE }, f(34));
      tl.fromTo("#cta-footnote", { opacity: 0 }, { opacity: 1, duration: f(24), ease: EASE }, f(34));
      // drive the three panel + DOM face from the same clock (ctaRenderAt is defined by the module below)
      tl.to({ v: 0 }, { v: 1, duration: 4.5, ease: "none", onUpdate: () => window.ctaRenderAt && window.ctaRenderAt(tl.time()) }, 0);
      window.__timelines["cta"] = tl;
    </script>
    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.186.1/+esm";

      const W = 1920;
      const H = 1080;
      const FPS = 30;
      const TILT_FRAMES = 24;
      const PANEL = { w: 1240, h: 780 };
      const DEPTH = 18;
      const FOV = 30;
      // pixel space: z=0 plane maps 1 unit = 1 px (== CSS perspective distance)
      const DIST = H / 2 / Math.tan(((FOV / 2) * Math.PI) / 180);
      const EASE = window.CTA_EASE;
      const lerp = (a, b, t) => a + (b - a) * t;

      const canvas = document.getElementById("cta-three");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.setClearColor(0x000000, 0);
      // @react-three/fiber defaults used by promo: flat => NoToneMapping, shadows="variance" => VSM, sRGB output
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.VSMShadowMap;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(FOV, W / H, 10, DIST * 4);
      camera.position.set(0, 0, DIST);
      camera.lookAt(0, 0, 0);

      // SoftDaylight (pixel-space.tsx)
      scene.add(new THREE.HemisphereLight("#FFFFFF", "#C9D3DF", 1.7));
      const sun = new THREE.DirectionalLight("#FFFFFF", 1.8);
      sun.position.set(-600, 900, 1400);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      const S = 1100;
      Object.assign(sun.shadow.camera, { left: -S, right: S, top: S, bottom: -S, near: 10, far: 6000 });
      sun.shadow.radius = 14;
      sun.shadow.blurSamples = 16;
      scene.add(sun);

      const matte = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.92, metalness: 0, transparent: true });
      const face = matte("#0B5E9F");
      const edge = matte("#3C8FD0");
      const shadowMat = new THREE.ShadowMaterial({ opacity: 0.28, transparent: true });

      const ground = new THREE.Mesh(new THREE.PlaneGeometry(W * 1.6, H * 1.6), shadowMat);
      ground.position.set(0, 0, -DEPTH - 60);
      ground.receiveShadow = true;
      scene.add(ground);

      const group = new THREE.Group();
      // material order: +x -x +y -y +z(face) -z(back=edge)
      const slab = new THREE.Mesh(new THREE.BoxGeometry(PANEL.w, PANEL.h, DEPTH), [edge, edge, edge, edge, face, edge]);
      slab.position.set(0, 0, -DEPTH / 2);
      slab.castShadow = true;
      group.add(slab);
      scene.add(group);

      const faceEl = document.getElementById("cta-face");

      function renderAt(time) {
        const frame = time * FPS;
        const tilt = Math.min(1, frame / (TILT_FRAMES - 1));
        const e = EASE(Math.min(1, Math.max(0, tilt)));
        const rx = lerp(0.16, 0, e);
        const ry = lerp(-0.42, 0, e);
        const panelIn = Math.min(1, Math.max(0, frame / 6));
        face.opacity = panelIn;
        edge.opacity = panelIn;
        shadowMat.opacity = 0.28 * panelIn;
        group.rotation.set(rx, ry, 0);
        // CSS y axis points down: three rotX(a) == CSS rotateX(-a); order Rx*Ry on both sides
        faceEl.style.transform = `perspective(${DIST}px) rotateX(${-rx}rad) rotateY(${ry}rad)`;
        group.visible = panelIn > 0.001;
        ground.visible = panelIn > 0.001;
        renderer.render(scene, camera);
      }
      window.ctaRenderAt = renderAt;
      window.addEventListener("hf-seek", (ev) => renderAt(ev.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
