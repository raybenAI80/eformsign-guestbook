<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <title>Compare T09</title>
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #16130e;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!-- standalone host for the compare-t09 scene (render: node tools/render-scene.mjs compare) -->
    <div
      id="root"
      data-composition-id="compare-host"
      data-start="0"
      data-duration="8"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-compare"
        data-composition-id="compare-t09"
        data-composition-src="compositions/compare-t09.html"
        data-start="0"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- narration (promo Narration id="repeat", 6.416 s) -->
      <audio id="compare-voice" src="assets/voice/repeat.mp3" data-start="0.5" data-duration="6.416" data-track-index="10" data-volume="1"></audio>
      <!-- BGM: Main60 track at its repeat offset (27 s), ducked to -12 dB -->
      <audio
        id="compare-bgm"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="8"
        data-media-start="27"
        data-track-index="12"
        data-volume="0.251189"
      ></audio>
    </div>
    <script>
      window.__timelines["compare-host"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
