<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <title>Hook T03</title>
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b1f36;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!-- standalone host for the hook-t03 scene (render: node tools/render-scene.mjs hook) -->
    <div
      id="root"
      data-composition-id="hook-host"
      data-start="0"
      data-duration="4.5"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-hook"
        data-composition-id="hook-t03"
        data-composition-src="compositions/hook-t03.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- narration (promo Narration id="hook", 4.41 s) -->
      <audio id="hook-voice" src="assets/voice/hook.mp3" data-start="0" data-duration="4.41" data-track-index="10" data-volume="1"></audio>
      <!-- BGM: Main60 track from 0 s, ducked to -12 dB under the narration -->
      <audio
        id="hook-bgm"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="4.5"
        data-media-start="0"
        data-track-index="12"
        data-volume="0.251189"
      ></audio>
    </div>
    <script>
      window.__timelines["hook-host"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
