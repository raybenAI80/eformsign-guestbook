<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <title>Bridge Sonnet</title>
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #16130e;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!-- standalone host for the compare-t09 scene (render: node tools/render-scene.mjs compare) -->
    <div
      id="root"
      data-composition-id="bridge-sonnet-host"
      data-start="0"
      data-duration="7"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-bridge"
        data-composition-id="bridge-sonnet"
        data-composition-src="scenes/bridge-sonnet/bridge-sonnet.html"
        data-start="0"
        data-duration="7"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["bridge-sonnet-host"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
