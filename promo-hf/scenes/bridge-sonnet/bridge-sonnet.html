<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      bridge-sonnet — v5.1 「브리지」 7초. 패턴 없음(사전에 단일 요소 느린 확대 전환 없음 → 직접 구성).
      종이 방명록(gen-01)의 펼친 노트 자리에서 태블릿 방명록 표(V3-step1 크롭)가 같은 자리·같은 크기로 떠올라
      하나의 연속 동작으로 화면 중앙까지 커진다. 0~0.5 s 종이 정지 · 0.5~4.0 전환 · 4.0~6.5 표 정지(자막 3.5 s~) · 6.5~7.0 정지.
    -->
  </head>
  <body>
    <template id="bridge-sonnet-template">
      <style>
        @font-face {
          font-family: "Paperlogy";
          src: url("assets/fonts/Paperlogy-8ExtraBold.ttf") format("truetype");
          font-weight: 800;
          font-display: block;
        }
        #bridge-sonnet,
        #bridge-sonnet * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          word-break: keep-all;
          overflow-wrap: break-word;
          line-break: strict;
        }
        #bridge-sonnet {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #16130e;
        }
        #bs-photo {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          transform-origin: 880px 880px;
        }
        #bs-photo img {
          display: block;
          width: 1920px;
          height: 1080px;
        }
        #bs-tab {
          position: absolute;
          left: 0;
          top: 0;
          width: 1646px;
          height: 1110px;
          transform-origin: 0 0;
          background: #fff;
          box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
          opacity: 0;
        }
        #bs-tab img {
          display: block;
          width: 1646px;
          height: 1110px;
        }
        #bs-cap {
          position: absolute;
          left: 0;
          right: 0;
          top: 888px;
          text-align: center;
          font-family: "Paperlogy", sans-serif;
          font-weight: 800;
          font-size: 64px;
          line-height: 1.3;
          color: #fff;
          text-shadow: 0 3px 22px rgba(0, 0, 0, 0.6);
          opacity: 0;
        }
      </style>

      <div id="bridge-sonnet" data-composition-id="bridge-sonnet" data-width="1920" data-height="1080" data-duration="7">
        <div id="bs-photo" data-layout-allow-overflow><img src="assets/gen/gen-01.png" alt="" /></div>
        <div id="bs-tab" data-layout-allow-overflow><img src="scenes/bridge-sonnet/tablet-crop.png" alt="" /></div>
        <div id="bs-cap">종이 그대로,<br />한 장에 여러 명</div>
      </div>

      <script>
        (function () {
          var ID = "bridge-sonnet";
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          var io = "sine.inOut";
          // table starts on the open notebook (≈ x495–1265, y775–985), same footprint, then grows to center
          tl.set("#bs-tab", { x: 495, y: 621, scale: 0.468, opacity: 0 }, 0);
          tl.set("#bs-photo", { scale: 1, filter: "brightness(1) blur(0px)" }, 0);
          tl.to("#bs-tab", { x: 367, y: 50, scale: 0.72, duration: 3.5, ease: io }, 0.5);
          tl.to("#bs-tab", { opacity: 1, duration: 1.6, ease: "power1.inOut" }, 0.5);
          tl.to("#bs-photo", { scale: 1.3, duration: 3.5, ease: io }, 0.5);
          tl.fromTo("#bs-photo", { filter: "brightness(1) blur(0px)" }, { filter: "brightness(0.3) blur(10px)", duration: 2.8, ease: "power1.in" }, 1.2);
          tl.fromTo("#bs-cap", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 3.5);
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
