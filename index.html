<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 🔴 user-scalable=no / maximum-scale 를 쓰지 않는다 — 저시력 작성자가 화면을 키울 수
     있어야 한다(WCAG 1.4.4). 작성자가 확대해 둔 상태는 세션이 바뀔 때 되돌아가지 않으므로,
     현장에서 문제가 되면 태블릿의 키오스크 모드(앱 고정·가이드 접근) 쪽에서 막는다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>키오스크</title>
<style>
  /* ── 한국어 줄바꿈 (korean-typography.css 드롭인, W3C klreq §7.1) ──────────
     정본: C:UsersFORCS.agent-harness	oolskorean-linebreakcsskorean-typography.css
     🔴 overflow-wrap: anywhere 금지 — min-content 에 어절 내부 분리 기회를 반영해
        flex/grid 자식이 어절 폭 아래로 수축하고 keep-all 이 무력화된다. */
  html { word-break: keep-all; overflow-wrap: break-word; line-break: strict; }
  body, p, li, dd, dt, td, th, h1, h2, h3, h4, h5, h6,
  figcaption, blockquote, label, button, a, span, div {
    word-break: keep-all; overflow-wrap: break-word;
  }
  p, li, dd, blockquote, .body, .desc, .note { text-wrap: pretty; }
  h1, h2, h3, h4, h5, h6, .title, .headline, .lead, .callout, .caption { text-wrap: balance; }
  /* 숫자+단위·로마자 고유명처럼 갈라지면 안 되는 어구 */
  .nb { white-space: nowrap; }

  :root {
    --brand: #0E73C3;
    --ink: #1a1a1a;
    --ink-weak: #5c6570;
    --line: #e3e7eb;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    /* 한국어 줄바꿈: 어절 내부 분리 금지 */
    word-break: keep-all;
    overflow-wrap: break-word;
    line-break: strict;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header#kioskHeader {
    flex: 0 0 auto;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  header#kioskHeader h1 {
    margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em;
    text-wrap: balance;
  }
  header#kioskHeader p {
    margin: 0; font-size: 14px; color: var(--ink-weak); text-wrap: balance;
  }
  /* 헤더 브랜드 — 로고가 있으면 로고, 없으면 회사명, 둘 다 없으면 제목만 */
  header#kioskHeader #brand { display: flex; align-items: center; flex: 0 0 auto; }
  header#kioskHeader #brand[hidden] { display: none !important; }
  header#kioskHeader #brandLogo { display: block; height: 40px; max-height: 40px; width: auto; max-width: 220px; object-fit: contain; }
  header#kioskHeader #brandLogo[hidden] { display: none !important; }
  header#kioskHeader #brandName { font-size: 16px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  header#kioskHeader #brandName[hidden] { display: none !important; }
  header#kioskHeader .bar {
    width: 4px; align-self: stretch; background: var(--brand); border-radius: 2px;
  }
  /* 「처음부터 다시」 — 헤더 우측. 오작동을 줄이려고 작게 두고, 누르면 확인 오버레이를 거친다. */
  #btnRestart {
    margin-left: auto; align-self: center;
    appearance: none; background: #fff; color: var(--brand);
    border: 1.5px solid var(--brand); border-radius: 8px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 8px 14px; cursor: pointer; white-space: nowrap;
  }
  #btnRestart[hidden] { display: none !important; }
  #btnRestart { min-height: 44px; }   /* 터치 타깃 44px 이상 */

  /* 키보드 포커스는 어디서든 눈에 보여야 한다 (WCAG 2.4.7) */
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; border-radius: 8px; }
  .overlay :focus-visible { outline-offset: 4px; }

  /* 화면 낭독기에만 읽히는 글 */
  .srOnly {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* 움직임을 줄여 달라고 설정한 사용자에게는 애니메이션을 끈다 (WCAG 2.3.3) */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    .spinner { border-top-color: var(--line); }
  }

  main#stage { position: relative; flex: 1 1 auto; min-height: 0; }
  /* 🔴 efs_embedded_v2.js 의 open() 은 $('#id').attr('src', url) 를 한다 →
     이 id 를 가진 요소는 반드시 <iframe> 이어야 한다(div 면 아무 일도 안 일어난다). */
  #frameHost { position: absolute; inset: 0; }
  #frameHost iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  /* 복귀 카운트다운이 뜬 동안에는 작성 중이던 내용을 흐리게 가린다(개인정보 노출 완화) */
  #frameHost.blurred iframe { filter: blur(6px); }

  /* 오버레이 공통 */
  .overlay {
    position: absolute; inset: 0; z-index: 10;
    background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 32px; text-align: center;
  }
  .overlay[hidden] { display: none !important; }
  .overlay h2 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
  .overlay p { margin: 0; font-size: 17px; color: var(--ink-weak); text-wrap: balance; }

  .check {
    width: 84px; height: 84px; border-radius: 50%;
    border: 3px solid var(--brand);
    display: flex; align-items: center; justify-content: center;
  }
  .check svg { width: 44px; height: 44px; stroke: var(--brand); fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }

  #countdown { font-size: 14px; color: var(--ink-weak); font-variant-numeric: tabular-nums; }

  /* 무응답 리셋 직전 경고 — 터치하면 계속 작성한다 */
  #ovIdle { gap: 14px; }
  #ovIdle .ring {
    width: 108px; height: 108px; border-radius: 50%;
    border: 4px solid var(--brand);
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; font-weight: 700; color: var(--brand);
    font-variant-numeric: tabular-nums;
  }
  #ovIdle h2 { font-size: 30px; }
  #ovIdle .hint { font-size: 19px; color: var(--brand); font-weight: 600; }

  .btn {
    appearance: none; border: 0; border-radius: 10px;
    background: var(--brand); color: #fff;
    font-size: 18px; font-weight: 600; padding: 14px 30px; cursor: pointer;
    font-family: inherit;
  }
  .btn.secondary { background: #fff; color: var(--brand); border: 1.5px solid var(--brand); }

  /* 「처음부터 다시」 확인 — 실수 터치로 내용이 날아가지 않도록 한 번 더 묻는다 */
  #ovRestart { z-index: 20; gap: 16px; }
  #ovRestart h2 { font-size: 30px; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--brand);
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #errBox {
    max-width: 620px; text-align: left; font-size: 13px; color: #8a2b2b;
    background: #fdf3f3; border: 1px solid #f0d0d0; border-radius: 8px; padding: 12px 14px;
    white-space: pre-wrap; word-break: break-all; overflow: auto; max-height: 240px;
  }

  #log {
    position: fixed; right: 8px; bottom: 8px; z-index: 50;
    width: 360px; max-height: 40vh; overflow: auto;
    background: rgba(20,24,28,.92); color: #d8e2ea;
    font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace;
    padding: 8px 10px; border-radius: 8px; white-space: pre-wrap;
  }
  #log[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header id="kioskHeader">
    <span id="brand" hidden>
      <img id="brandLogo" alt="" hidden>
      <span id="brandName" hidden></span>
    </span>
    <span class="bar" aria-hidden="true"></span>
    <div>
      <h1 id="hTitle">문서 작성</h1>
      <p id="hSub">내용을 작성한 뒤 전송을 눌러 주세요.</p>
    </div>
    <button id="btnRestart" type="button"
            aria-label="작성하던 내용을 지우고 처음부터 다시 시작">처음부터 다시</button>
  </header>

  <main id="stage">
    <div id="frameHost"><iframe id="eformsign_iframe" title="문서 작성 화면" allow="camera; microphone; clipboard-write; local-network-access"></iframe></div>

    <!-- 로딩 -->
    <section class="overlay" id="ovLoading" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>작성 화면을 준비하고 있습니다.</p>
    </section>

    <!-- 감사합니다 -->
    <section class="overlay" id="ovThanks" role="status" aria-live="polite" hidden>
      <div class="check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h2 id="thanksTitle">작성해 주셔서 감사합니다.</h2>
      <p id="thanksSub">잠시 후 처음 화면으로 돌아갑니다.</p>
      <p id="countdown" aria-hidden="true"></p>
      <button class="btn secondary" id="btnSkip" type="button">지금 다음 작성 시작</button>
    </section>

    <!-- 무응답 리셋 경고 — 시간이 걸려 있는 알림이므로 alertdialog 로 알린다 -->
    <section class="overlay" id="ovIdle" role="alertdialog" aria-modal="true"
             aria-labelledby="idleTitle" aria-describedby="idleSpoken" hidden>
      <div class="ring" id="idleRing" aria-hidden="true">5</div>
      <h2 id="idleTitle">계속 작성하시겠습니까?</h2>
      <p class="hint" aria-hidden="true">아무 곳이나 터치하면 계속 작성합니다.</p>
      <p id="idleSub" aria-hidden="true">응답이 없으면 처음 화면으로 돌아갑니다.</p>
      <!-- 낭독용 한 문장. 화면에 보이는 두 줄을 합친 것이라 눈으로는 보이지 않게 둔다. -->
      <p id="idleSpoken" class="srOnly" aria-live="assertive"></p>
      <button class="btn" id="btnKeep" type="button">계속 작성하기</button>
    </section>

    <!-- 「처음부터 다시」 확인 -->
    <section class="overlay" id="ovRestart" role="alertdialog" aria-modal="true"
             aria-labelledby="restartTitle" aria-describedby="restartDesc" hidden>
      <h2 id="restartTitle">입력한 내용이 지워집니다.</h2>
      <p id="restartDesc">처음부터 다시 시작할까요?</p>
      <div class="actions">
        <button class="btn" id="btnRestartYes" type="button">처음부터 다시 시작</button>
        <button class="btn secondary" id="btnRestartNo" type="button">계속 작성하기</button>
      </div>
    </section>

    <!-- 오류 -->
    <section class="overlay" id="ovError" hidden>
      <h2>작성 화면을 열지 못했습니다.</h2>
      <p id="errHint">관리자에게 알려 주세요.</p>
      <pre id="errBox"></pre>
      <button class="btn" id="btnRetry" type="button">다시 시도</button>
    </section>
  </main>
</div>

<pre id="log" hidden aria-hidden="true"></pre>

<script src="https://www.eformsign.com/plugins/jquery/jquery.min.js"></script>
<script src="https://www.eformsign.com/lib/js/efs_embedded_v2.js"></script>
<script src="config.js"></script>
<script>
(function () {
  'use strict';

  // ---------- 설정 병합 (config.js + URL 쿼리) ----------
  var q = new URLSearchParams(location.search);
  var C = Object.assign({}, window.KIOSK_CONFIG || {});
  if (q.get('mode')) C.mode = q.get('mode');
  if (q.get('sec')) C.thanksSeconds = Number(q.get('sec'));
  if (q.get('idle')) C.idleResetSeconds = Number(q.get('idle'));
  if (q.get('abandon')) C.abandonResetSeconds = Number(q.get('abandon'));
  if (q.get('countdown')) C.countdownSeconds = Number(q.get('countdown'));
  if (q.get('template')) C.templateId = q.get('template');
  if (q.get('company')) C.companyId = q.get('company');
  if (q.get('debug')) C.debug = q.get('debug') !== '0';
  if (C.mode !== 'immediate' && C.mode !== 'thanks') C.mode = 'thanks';
  if (!(C.thanksSeconds > 0)) C.thanksSeconds = 4;
  // 무응답 리셋: 입력 시작 전(idle) / 입력 중 이탈(abandon) 두 기준을 따로 둔다.
  if (!(C.idleResetSeconds >= 0)) C.idleResetSeconds = 120;
  if (!(C.abandonResetSeconds > 0)) C.abandonResetSeconds = 180;
  // 복귀 카운트다운 — 리셋 몇 초 전부터 "계속 작성하시겠습니까?" 를 띄울지
  if (!(C.countdownSeconds > 0)) C.countdownSeconds = 5;

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    stage: $('stage'), host: $('frameHost'),
    loading: $('ovLoading'), thanks: $('ovThanks'), error: $('ovError'),
    idle: $('ovIdle'), idleRing: $('idleRing'), idleSub: $('idleSub'), btnKeep: $('btnKeep'),
    errBox: $('errBox'), errHint: $('errHint'), countdown: $('countdown'),
    hTitle: $('hTitle'), hSub: $('hSub'),
    thanksTitle: $('thanksTitle'), thanksSub: $('thanksSub'),
    btnSkip: $('btnSkip'), btnRetry: $('btnRetry'), log: $('log'),
    btnRestart: $('btnRestart'), restart: $('ovRestart'),
    btnRestartYes: $('btnRestartYes'), btnRestartNo: $('btnRestartNo')
  };

  // ── 브랜드(로고/회사명) ── logoUrl > companyName > title 순으로 하나만 보여 준다.
  document.title = C.productName || '키오스크';
  (function applyBrand() {
    var brand = $('brand'), logo = $('brandLogo'), name = $('brandName');
    if (C.logoUrl) {
      logo.src = C.logoUrl;
      // 로고 그림의 대체글은 회사 이름이다. 회사 이름을 안 넣었으면 최소한 「회사 로고」로 읽힌다.
      logo.alt = C.companyName || C.title || '회사 로고';
      logo.hidden = false;
      brand.hidden = false;
      // 로고 파일을 못 읽으면 회사명으로 내려간다(빈 상자를 남기지 않는다).
      logo.addEventListener('error', function () {
        logo.hidden = true;
        if (C.companyName) { name.textContent = C.companyName; name.hidden = false; }
        else brand.hidden = true;
      });
    } else if (C.companyName) {
      name.textContent = C.companyName;
      name.hidden = false;
      brand.hidden = false;
    }
  })();

  els.hTitle.textContent = C.title || '문서 작성';
  els.hSub.textContent = C.subtitle || '내용을 작성한 뒤 전송을 눌러 주세요.';
  els.thanksTitle.textContent = C.thanksMessage || '작성해 주셔서 감사합니다.';
  els.thanksSub.textContent = C.thanksSubMessage || '';
  els.idleRing.textContent = String(C.countdownSeconds);
  if (C.debug) els.log.hidden = false;

  // ---------- 로그 ----------
  var logLines = [];
  window.__kioskLog = logLines;
  function log() {
    var msg = new Date().toISOString().slice(11, 23) + ' ' +
      Array.prototype.map.call(arguments, function (a) {
        return typeof a === 'string' ? a : JSON.stringify(a);
      }).join(' ');
    logLines.push(msg);
    if (logLines.length > 400) logLines.shift();
    if (!els.log.hidden) { els.log.textContent = logLines.slice(-60).join('\n'); els.log.scrollTop = els.log.scrollHeight; }
    try { console.log('[kiosk]', msg); } catch (e) {}
  }

  // ---------- 상태 ----------
  var state = { session: 0, phase: 'boot', docs: [], formReady: false, loads: 0, submits: 0 };
  window.__kioskState = state;

  function show(which) {
    els.loading.hidden = which !== 'loading';
    els.thanks.hidden = which !== 'thanks';
    els.error.hidden = which !== 'error';
    els.btnRestart.hidden = which === 'thanks';   // 감사 화면에서는 되돌릴 것이 없다
    if (which !== null) closeRestartConfirm();
    if (which) cancelWarn('show:' + which);      // 무응답 경고는 작성 화면에서만 뜬다
    state.phase = which || 'form';
    log('phase=' + state.phase);
  }

  // ---------- 무응답 리셋 ----------
  // 🔴 작성 프레임은 cross-origin iframe 이라 그 안의 터치·키 입력이 부모 document 로
  //    올라오지 않는다. 실측(2026-09-16)으로 프레임은 입력 활동에 대응하는 postMessage 도
  //    보내지 않는다 — 오는 것은 라이프사이클 메시지(uniConnect / isEmbedding /
  //    actionCallback func_onload·전송)뿐이다. 즉 **프레임 안의 활동은 관측할 수 없다.**
  //
  //    그래서 타이머는 "마지막으로 관측된 활동"부터 벽시계로 센다. 관측 가능한 활동은
  //      (a) 부모 영역의 pointer/touch/key/wheel
  //      (b) 포커스가 프레임 **안으로 들어간 순간**(1회) — 그 뒤로 프레임 안에 머무는
  //          시간은 활동으로 치지 않는다. 이전 판은 여기서 매 초 타이머를 되감아
  //          "칸에 글을 쓰다 그대로 떠난 작성자"가 영원히 리셋되지 않았다.
  //      (c) 이폼사인 action_callback / postMessage 수신(라이프사이클)
  //    리셋 기준은 두 가지다.
  //      · 입력 시작 전(프레임에 한 번도 포커스가 안 간 세션) = idleResetSeconds
  //      · 입력 중(프레임에 포커스가 갔던 세션)               = abandonResetSeconds
  //    오래 쓰는 작성자는 카운트다운 덮개를 한 번 터치하면 계속 쓸 수 있다(덮개가 화면
  //    전체를 덮으므로 어디를 터치해도 부모가 받는다).
  var WARN_SECONDS = C.countdownSeconds;      // 복귀 카운트다운(초) — config.countdownSeconds / ?countdown=
  var idle = { last: Date.now(), source: 'boot', engaged: false, warnLeft: 0, inFrame: false };
  window.__kioskIdle = idle;

  function frameFocused() {
    var f = els.host.querySelector('iframe');
    return !!(f && document.activeElement === f);
  }
  function armIdle(source) {
    idle.last = Date.now();
    idle.source = source || 'parent-input';
    if (idle.warnLeft > 0) cancelWarn(idle.source);
  }
  // 포커스가 프레임 안으로 "들어간 순간"만 활동 1회로 친다(머무는 동안은 아님).
  function noteFrameFocus() {
    if (idle.inFrame) return false;
    idle.inFrame = true;
    if (!idle.engaged) {
      idle.engaged = true;
      log('작성 프레임 진입(engaged) — 이후 리셋 기준 abandonResetSeconds=' + C.abandonResetSeconds + 's');
    } else {
      log('작성 프레임 재진입 — 활동으로 기록(frame-focus)');
    }
    armIdle('frame-focus');
    return true;
  }
  ['pointerdown', 'touchstart', 'keydown', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, function () { armIdle('parent:' + ev); }, { passive: true });
  });
  // window blur 시 포커스가 iframe 으로 넘어갔으면 = 작성자가 작성 프레임 안에 있다
  window.addEventListener('blur', function () {
    setTimeout(function () { if (frameFocused()) noteFrameFocus(); }, 0);
  });

  function idleLimitSeconds() {
    if (!(C.idleResetSeconds > 0)) return 0;          // 0 = 리셋 끔
    return idle.engaged ? C.abandonResetSeconds : C.idleResetSeconds;
  }

  // 낭독기가 초마다 떠들지 않도록, 처음 뜰 때와 3초 남았을 때만 문장을 새로 읽힌다.
  var idleSpokenAt = 0;
  function speakWarn(left) {
    var el = document.getElementById('idleSpoken');
    if (!el) return;
    if (left === idleSpokenAt) return;
    idleSpokenAt = left;
    el.textContent = left + '초 뒤 처음 화면으로 돌아갑니다. 계속하려면 화면을 터치하거나 아무 키나 누르세요.';
  }

  function showWarn(left) {
    idle.warnLeft = left;
    els.idleRing.textContent = String(left);
    els.idleSub.textContent = left + '초 뒤 처음 화면으로 돌아갑니다.';
    if (els.idle.hidden) {
      els.idle.hidden = false;
      els.host.classList.add('blurred');        // 카운트다운 동안 작성 내용을 가린다
      idleSpokenAt = 0;
      speakWarn(left);
      // 포커스를 덮개 안으로 가져온다 — 작성 프레임 안에 있던 키보드 사용자도
      // 이 알림을 듣고 Enter/Space 로 곧장 이어서 작성할 수 있다.
      try { els.btnKeep && els.btnKeep.focus({ preventScroll: true }); } catch (e) {}
      log('무응답 경고 표시 — 남은 ' + left + 's, 마지막 활동 출처=' + idle.source);
    } else if (left === 3) {
      speakWarn(left);
    }
  }
  function cancelWarn(by) {
    if (idle.warnLeft > 0 || !els.idle.hidden) log('무응답 경고 취소 by=' + (by || 'unknown'));
    idle.warnLeft = 0;
    els.idle.hidden = true;
    idleSpokenAt = 0;
    var sp = document.getElementById('idleSpoken');
    if (sp) sp.textContent = '';
    els.host.classList.remove('blurred');
  }

  setInterval(function () {
    if (state.phase !== 'form') { cancelWarn('phase=' + state.phase); return; }
    var limit = idleLimitSeconds();
    if (!limit) { cancelWarn('disabled'); return; }
    // 포커스가 프레임 안으로 들어간 순간만 활동 1회. 머무는 동안은 타이머를 멈추지 않는다.
    if (frameFocused()) noteFrameFocus();
    else idle.inFrame = false;
    var elapsed = (Date.now() - idle.last) / 1000;
    if (elapsed >= limit) {
      log('무응답 리셋 실행 — 사유=' + (idle.engaged ? 'abandon' : 'idle') +
          ' 한도=' + limit + 's 경과=' + Math.round(elapsed) + 's 마지막 활동 출처=' + idle.source);
      cancelWarn('reset');
      startSession(idle.engaged ? 'abandon' : 'idle');
      return;
    }
    if (elapsed >= limit - WARN_SECONDS) showWarn(Math.max(1, Math.ceil(limit - elapsed)));
    else if (!els.idle.hidden) cancelWarn('activity');
  }, 1000);

  els.btnKeep && els.btnKeep.addEventListener('click', function () { armIdle('keep-button'); });

  // ---------- 「처음부터 다시」 ----------
  var restartLastFocus = null;
  function closeRestartConfirm() {
    if (!els.restart.hidden) {
      els.restart.hidden = true;
      log('처음부터 다시 — 취소(입력 내용 유지)');
      // 대화상자를 닫으면 열었던 자리로 포커스를 돌려 놓는다.
      try { (restartLastFocus || els.btnRestart).focus({ preventScroll: true }); } catch (e) {}
      restartLastFocus = null;
    }
  }
  els.btnRestart.addEventListener('click', function () {
    armIdle('restart-button');
    if (state.phase === 'thanks') return;
    restartLastFocus = document.activeElement;
    els.restart.hidden = false;
    // 「내용이 지워집니다」이므로 안전한 쪽(계속 작성하기)에 포커스를 둔다.
    try { els.btnRestartNo.focus({ preventScroll: true }); } catch (e) {}
    log('처음부터 다시 — 확인 요청 phase=' + state.phase);
  });
  // Esc 로 확인 대화상자를 닫는다. Tab 은 대화상자 안에서만 돈다.
  document.addEventListener('keydown', function (e) {
    if (els.restart.hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); armIdle('restart-esc'); closeRestartConfirm(); return; }
    if (e.key !== 'Tab') return;
    var f = els.restart.querySelectorAll('button');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  els.btnRestartYes.addEventListener('click', function () {
    els.restart.hidden = true;
    log('처음부터 다시 — 사용자 확인, 세션을 새로 시작한다');
    startSession('manual');
  });
  els.btnRestartNo.addEventListener('click', function () { armIdle('restart-cancel'); closeRestartConfirm(); });

  // ---------- 브라우저 이탈 방지 ----------
  history.pushState(null, '', location.href);
  window.addEventListener('popstate', function () {
    history.pushState(null, '', location.href);
    log('back suppressed');
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  // 🔴 efs_embedded_v2.js 는 iframe 이 보내는 `completeWriteDocument` 메시지를 받으면
  //    전역 함수 completeWriteDocument(data, iframe) 를 부른다. 이 함수를 부모 페이지가
  //    정의해 두지 않으면 ReferenceError 로 메시지 처리가 통째로 죽고 success_callback 도 오지 않는다.
  //    (스크립트 상단 주석이 /* global ... completeWriteDocument */ 인 이유.)
  window.completeWriteDocument = function (data, srcIframe) {
    log('completeWriteDocument', data && data.message ? data.message : data);
    try { if (srcIframe && srcIframe.postMessage) srcIframe.postMessage(JSON.stringify({ type: 'document', fn: 'completeWriteDocumentCallback', message: {} }), '*'); } catch (e) {}
    onSuccess((data && data.message) || data || {});
  };

  // 진단: iframe 이 보내는 모든 postMessage 를 그대로 남긴다
  window.addEventListener('message', function (e) {
    if (!e.origin || e.origin.indexOf('eformsign') === -1) return;
    var d = e.data; try { if (typeof d === 'string') d = JSON.parse(d); } catch (x) {}
    var dump; try { dump = JSON.stringify(d); } catch (x) { dump = String(d); }
    log('RAW message', (dump || '').slice(0, 400));
    armIdle('postMessage');                       // 프레임이 말을 걸었다 = 살아 있는 세션
  });

  // ---------- 이폼사인 구동 ----------
  // '@today' -> 오늘 날짜(YYYY-MM-DD). 방문일시처럼 매번 같은 값을 손으로 고르게 하지 않는다.
  function resolveValue(v) {
    if (v !== '@today') return v;
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function buildOption() {
    var opt = {
      company: { id: C.companyId, country_code: C.countryCode || 'kr' },
      user: { type: '02', external_user_info: { name: C.visitorName || '작성자' } },
      mode: { type: '01', template_id: C.templateId },
      layout: {
        lang_code: C.langCode || 'ko',
        header: C.showHeader !== false,
        hide_request_popup: C.hideRequestPopup === true
      }
    };
    if (C.prefill && C.prefill.length) {
      opt.prefill = {
        fields: C.prefill.map(function (f) {
          var o = { id: f.id, value: resolveValue(f.value) };
          if (f.enabled !== undefined) o.enabled = f.enabled;
          if (f.required !== undefined) o.required = f.required;
          return o;
        })
      };
    }
    return opt;
  }

  // 세션마다 iframe 을 통째로 새로 만든다 → 직전 작성자의 입력값·뷰어 상태가 남지 않는다.
  function clearFrame() {
    els.host.innerHTML = '';
    var f = document.createElement('iframe');
    f.id = 'eformsign_iframe';
    f.title = '문서 작성';
    f.setAttribute('allow', 'camera; microphone; clipboard-write; local-network-access');
    // action_callback 이 오지 않는 경우에도 화면이 멈추지 않도록 load 를 보조 신호로 쓴다
    f.addEventListener('load', function () {
      state.loads += 1;
      log('iframe load #' + state.loads + (state.formReady ? ' (작성 화면 이후)' : ''));
      if (state.phase === 'loading') show(null);
      armIdle('iframe-load');
      // 🔴 외부 작성자(user.type "02") 신규 작성에서는 제출해도 success_callback 이 오지 않는다.
      //    제출하면 iframe 이 스스로 이폼사인의 제출 완료 안내 화면으로 이동한다 →
      //    "작성 화면 로드(action_callback) 이후의 iframe 이동" 을 제출 신호로 쓴다.
      if (state.formReady && state.phase === 'form') {
        state.formReady = false;
        log('제출 감지(iframe 이동)');
        setTimeout(function () { onSubmitted({ via: 'iframe-navigation' }); }, 300);
      }
    });
    els.host.appendChild(f);
  }

  // 작성 화면이 이 시간 안에 뜨지 않으면 설정 문제로 보고 관리자 안내를 띄운다.
  // 🔴 근거: 「URL로 문서 생성 허용」 OFF 를 실기로 재현했을 때 error_callback 이 오지 않고
  //    formReady 만 false 로 남았다(2026-09-16). 정상 로드는 실측 3~9초였다.
  var LOAD_WATCH_SECONDS = 25;
  var loadWatchTimer = null;

  function startSession(reason) {
    var my = ++state.session;
    state.formReady = false;
    log('startSession#' + my + ' reason=' + reason + ' mode=' + C.mode);
    show('loading');
    clearFrame();
    clearTimeout(loadWatchTimer);
    loadWatchTimer = setTimeout(function () {
      if (my !== state.session || state.formReady) return;
      log('서식 로드 감시 시간 초과 — 설정 안내 표시');
      showSetupHint();
    }, (Number(C.loadWatchSeconds) > 0 ? Number(C.loadWatchSeconds) : LOAD_WATCH_SECONDS) * 1000);
    idle.engaged = false;            // 새 세션 = 아직 아무도 입력을 시작하지 않았다
    idle.inFrame = false;            // 포커스 진입 판정도 초기화한다
    armIdle('session-start');

    var opt = buildOption();
    log('option', opt);

    try {
      var efs = new EformSignDocument();
      window.__kioskEfs = efs;
      efs.document(
        opt,
        'eformsign_iframe',
        function (res) { if (my === state.session) onSuccess(res); },
        function (res) { if (my === state.session) onError(res); },
        function (res) { if (my === state.session) onAction(res); }
      );
      efs.open();
      window.__kioskEfsList = (window.__kioskEfsList || []).concat([efs]);
    } catch (e) {
      onError({ code: 'JS', message: (e && e.message) || String(e), stack: e && e.stack });
    }
  }

  function onAction(res) {
    log('action_callback', res && (res.data || res));
    if (state.phase === 'loading') show(null);
    state.formReady = true;     // 작성 화면이 떴다 = 이후의 iframe 이동은 제출로 본다
    clearTimeout(loadWatchTimer);   // 정상 로드 — 감시 해제
    armIdle('action_callback');
  }

  function onSuccess(res) {
    log('success_callback', res);
    state.formReady = false;
    if (res && res.document_id) state.docs.push(res.document_id);
    else if (res && res.message && res.message.document_id) state.docs.push(res.message.document_id);
    window.__kioskDocs = state.docs;
    armIdle('submit');

    onSubmitted(res);
  }

  // 제출 확정 처리(콜백 경로/네비게이션 경로 공통). 한 세션에서 한 번만 동작한다.
  var submittedForSession = -1;
  function onSubmitted(info) {
    if (submittedForSession === state.session) return;
    submittedForSession = state.session;
    state.submits += 1;
    log('onSubmitted #' + state.submits, info);
    armIdle('submitted');
    cancelWarn('submitted');
    if (C.mode === 'immediate') startSession('after-submit-immediate');
    else showThanks();
  }

  function onError(res) {
    log('error_callback', res);
    els.errHint.textContent = '관리자에게 알려 주세요.';
    els.errBox.textContent = JSON.stringify(res, null, 2);
    show('error');
  }

  // 서식은 불러오는데 작성 화면이 끝내 뜨지 않는 경우 = 서식 설정 문제일 가능성이 가장 높다.
  function showSetupHint() {
    els.errHint.textContent =
      '담당자 확인 사항: 이폼사인에서 이 서식을 열고 「URL로 문서 생성 허용」이 켜져 있는지, '
      + '서식을 고친 뒤 다시 발행했는지 확인해 주세요.';
    els.errBox.textContent =
      '서식 ID: ' + (C.templateId || '(없음)') + '\n회사 ID: ' + (C.companyId || '(없음)');
    show('error');
  }

  // ---------- 감사 화면 ----------
  var thanksTimer = null, tickTimer = null;
  function showThanks() {
    show('thanks');
    var left = C.thanksSeconds;
    els.countdown.textContent = left + '초 후 다음 작성 화면으로 넘어갑니다.';
    clearInterval(tickTimer); clearTimeout(thanksTimer);
    tickTimer = setInterval(function () {
      left -= 1;
      els.countdown.textContent = (left > 0 ? left : 0) + '초 후 다음 작성 화면으로 넘어갑니다.';
    }, 1000);
    thanksTimer = setTimeout(function () {
      clearInterval(tickTimer);
      startSession('after-thanks');
    }, C.thanksSeconds * 1000);
  }

  els.btnSkip.addEventListener('click', function () {
    clearInterval(tickTimer); clearTimeout(thanksTimer);
    startSession('skip-thanks');
  });
  els.btnRetry.addEventListener('click', function () { startSession('retry'); });

  // 테스트 훅
  window.__kioskRestart = startSession;
  window.__kioskSimulateSubmit = function (docId) {
    onSuccess({ code: '-1', document_id: docId || ('SIM-' + Date.now()) });
  };

  // ---------- 시작 ----------
  if (typeof EformSignDocument === 'undefined') {
    onError({ code: 'SCRIPT', message: '이폼사인 작성 스크립트를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요. 파일 이름: efs_embedded_v2.js' });
  } else {
    startSession('boot');
  }
})();
</script>
</body>
</html>
